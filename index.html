<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老師簽收系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        /* 確保在畫布上簽名時，網頁不會跟著滑動 */
        #signaturePad { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- 頂部紫藍色標題列 -->
    <div class="bg-indigo-600 text-white p-4 rounded-b-xl shadow-md mb-4">
        <div class="flex items-center space-x-3">
            <i class="fas fa-file-signature text-2xl"></i>
            <div>
                <h1 class="text-xl font-bold leading-tight">老師簽收系統</h1>
                <p class="text-xs text-indigo-200">請填寫姓名、拍照並完成簽名</p>
            </div>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="p-4 space-y-5 max-w-2xl mx-auto">
        
        <!-- 1. 基本資料 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <label class="block text-sm font-bold text-gray-700 mb-2"><i class="fas fa-user mr-1 text-indigo-500"></i> 老師姓名 <span class="text-red-500">*</span></label>
            <input type="text" id="teacherName" placeholder="請輸入您的姓名" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <!-- 2. 拍照上傳 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <label class="block text-sm font-bold text-gray-700"><i class="fas fa-camera mr-1 text-indigo-500"></i> 現場拍照 <span class="text-red-500">*</span></label>
                <span id="photoStatus" class="text-red-500 text-xs font-bold"><i class="fas fa-times-circle"></i> 尚未拍攝</span>
            </div>
            
            <div class="flex items-center space-x-3 mb-2">
                <label class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-lg cursor-pointer flex items-center shadow-sm transition w-full justify-center">
                    <i class="fas fa-image mr-2"></i> 點擊開啟相機 / 相簿
                    <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="previewPhoto(event)">
                </label>
            </div>
            
            <!-- 相片預覽 -->
            <div id="previewContainer" class="hidden relative w-full h-48 mt-3">
                <img id="photoPreview" class="w-full h-full object-contain bg-gray-50 rounded-lg border border-gray-200">
                <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow hover:bg-red-600"><i class="fas fa-trash text-sm"></i></button>
            </div>
        </div>

        <!-- 3. 手寫簽名 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <label class="block text-sm font-bold text-gray-700"><i class="fas fa-pen mr-1 text-indigo-500"></i> 手寫簽名 <span class="text-red-500">*</span></label>
                <button type="button" onclick="clearSignature()" class="text-xs text-gray-500 hover:text-red-500 flex items-center transition">
                    <i class="fas fa-eraser mr-1"></i> 清除重簽
                </button>
            </div>
            <div class="border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 overflow-hidden relative">
                <!-- 畫布 -->
                <canvas id="signaturePad" class="w-full h-48"></canvas>
                <!-- 浮水印提示 -->
                <div id="signPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-gray-300 font-bold text-xl">
                    請在此處簽名
                </div>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <button id="submitBtn" onclick="submitForm()" class="w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95">
            <i class="fas fa-paper-plane mr-2"></i> 確認送出
        </button>
    </div>

    <!-- 上傳中遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-70 hidden flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-indigo-400 mb-4"></div>
        <p class="text-white text-lg font-bold tracking-wider">資料加密上傳中...</p>
        <p class="text-indigo-200 text-sm mt-2">請勿關閉此畫面</p>
    </div>

    <script>
        // ⚠️ 【非常重要】請將您 Apps Script 的網址貼在下方的單引號內
        const SCRIPT_URL = '請將您的_Apps_Script_網址貼在這裡';

        // --- 相片處理邏輯 ---
        let base64Photo = "";

        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Photo = e.target.result;
                    document.getElementById('photoPreview').src = base64Photo;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    
                    const status = document.getElementById('photoStatus');
                    status.innerHTML = '<i class="fas fa-check-circle"></i> 照片已就緒';
                    status.className = 'text-green-600 text-xs font-bold';
                }
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            base64Photo = "";
            document.getElementById('photoInput').value = "";
            document.getElementById('previewContainer').classList.add('hidden');
            
            const status = document.getElementById('photoStatus');
            status.innerHTML = '<i class="fas fa-times-circle"></i> 尚未拍攝';
            status.className = 'text-red-500 text-xs font-bold';
        }

        // --- 簽名畫布邏輯 ---
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('signPlaceholder');
        let isDrawing = false;
        let isSigned = false; // 記錄是否有簽名

        // 調整畫布實際像素大小以符合畫面
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // 設定畫筆樣式
            ctx.strokeStyle = "#1e3a8a"; // 深藍色筆跡
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 開始畫
        function startDrawing(e) {
            isDrawing = true;
            isSigned = true;
            placeholder.style.display = 'none'; // 隱藏提示字
            draw(e);
        }

        // 停止畫
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // 畫圖中
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // 防止滑動螢幕
            
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 綁定滑鼠與觸控事件
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // 清除簽名
        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            isSigned = false;
            placeholder.style.display = 'flex'; // 顯示提示字
            ctx.beginPath(); // 重置路徑
        }

        // --- 提交表單邏輯 ---
        function submitForm() {
            // 1. 檢查網址是否設定
            if (SCRIPT_URL.includes("請將您的")) {
                alert("【錯誤】請先在 GitHub 程式碼中設定 SCRIPT_URL 網址！");
                return;
            }

            // 2. 收集與檢查資料
            const name = document.getElementById('teacherName').value.trim();
            if (!name) {
                alert("請輸入老師姓名！");
                document.getElementById('teacherName').focus();
                return;
            }
            if (!base64Photo) {
                alert("請拍攝或上傳一張照片！");
                return;
            }
            if (!isSigned) {
                alert("請在畫布上簽名！");
                return;
            }

            // 擷取簽名圖片
            const signatureBase64 = canvas.toDataURL("image/png");

            // 3. 顯示載入中動畫
            document.getElementById('loadingOverlay').classList.remove('hidden');

            // 4. 打包要傳送的資料
            const payload = {
                name: name,
                date: new Date().toLocaleDateString('zh-HK') + ' ' + new Date().toLocaleTimeString('zh-HK'),
                photo: base64Photo,
                signature: signatureBase64
            };

            // 5. 傳送到 Google Apps Script
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert("✅ 送出成功！檔案已儲存至 Google Drive。");
                window.location.reload(); // 重新載入準備下一位
            })
            .catch(error => {
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert("❌ 傳送失敗，請檢查網路連線後再試一次。");
                console.error(error);
            });
        }
    </script>
</body>
</html>
